[project]
name = "butler-debug-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["butler-contracts", "butler-actions", "pydantic>=2.7", "boto3>=1.35", "starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debug_api"]
