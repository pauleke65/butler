[project]
name = "butler-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["butler-contracts","butler-rules","butler-actions","butler-action-handlers","butler-executor","butler-agent","butler-local","butler-debug-api"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "datamodel-code-generator>=0.26",
  "moto[server,dynamodb]>=5.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/contracts/py",
  "libs/butler_rules",
  "libs/butler_actions",
  "actions",
  "executor",
  "agent",
  "local",
  "debug-api",
]

[tool.uv.sources]
butler-contracts = { workspace = true }
butler-rules = { workspace = true }
butler-actions = { workspace = true }
butler-action-handlers = { workspace = true }
butler-executor = { workspace = true }
butler-agent = { workspace = true }
butler-local = { workspace = true }
butler-debug-api = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["packages", "libs", "actions", "executor", "agent", "local", "debug-api"]

[tool.ruff]
line-length = 110
target-version = "py312"
